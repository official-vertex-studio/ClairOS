[package]
name = "clairos-desktop"
version = "0.1.0"
description = "ClairOS by Gab9SG - Bureau Linux"
authors = ["Gab9SG"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "clairos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.6.0"
zbus = { version = "5", features = ["blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "http2"] }
scraper = "0.22"
base64 = "0.22"
quick-xml = { version = "0.38", features = ["serialize"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
argon2 = "0.5"
portable-pty = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
