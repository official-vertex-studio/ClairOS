---
defaultGroups:
    - users
    - audio
    - video
    - cdrom
    - plugdev
    - netdev
    - sudo
    - clairos
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
userShell: /bin/bash
passwordRequirements:
    minLength: -1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
